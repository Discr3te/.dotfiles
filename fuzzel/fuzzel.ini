[main]
prompt="❯ "
font=JetBrainsMono Nerd Font:size=17
icons-enabled=yes
icon-theme=Papirus-Dark
fields=name,generic,comment,categories,filename,keywords
show-actions=yes
lines=10
width=40
tabs=2
horizontal-pad=24
vertical-pad=16
inner-pad=10
exit-on-keyboard-focus-loss=yes
terminal=alacritty -e
output=<focused>
list-executables-in-path=yes

[border]
width=2
radius=10

[dmenu]
mode=text
exit-immediately-if-empty=no

[colors]
background=1a1b26f2
text=c0caf5ff
match=7aa2f7ff
selection=33467cff
selection-text=c0caf5ff
selection-match=7dcfffff
border=7aa2f7ff
prompt=7aa2f7ff

[key-bindings]
prev=Up Control+k
next=Down Control+j
cursor-left=Control+h Left
cursor-right=Control+l Right
delete-prev=BackSpace
delete-line-forward=none
