$desktop_screen=desc:BNQ BenQ RD280U 65S0044501Q
$laptop_t14_screen=desc:Lenovo Group Limited 0x403D
$font = JetBrainsMono Nerd Font Propo
$weight = weight="500"
$style = style="italic"
$bg = rgba(0, 0, 0, 1)
$fg = rgba(255, 255, 255, 1)

general {
  ignore_empty_input = true
  immediate_render = true
  fail_timeout = 1
  fractional_scaling = 2
}

auth {
  pam:enabled = true
  pam:module = /etc/pam.d/hyprlock
}

animations {
  enabled = false
}

background {
  color = $bg
}

# =============================================================================
# DESKTOP
# =============================================================================

# TIME
label {
  monitor = $desktop_screen
  text = $TIME12
  color = $fg
  font_size = 200
  font_family = $font
  position = 0%, 15%
}

# DATE
label {
  monitor = $desktop_screen
  text = cmd[update:60000] date +"%A, %B %d"
  color = $fg
  font_size = 70
  font_family = $font
  position = 0%, 8.5%
}

# Password
input-field {
  monitor = $desktop_screen
  size = 32.25%, 8%
  outline_thickness = 2
  dots_size = .3
  dots_spacing = .25
  outer_color = rgba(250, 250, 250, 0)
  inner_color = rgba(250, 250, 250, 0.35)
  font_color = rgba(15, 15, 15, 0.90)
  font_family = $font
  fade_on_empty = false
  placeholder_text = <span $style $weight> Password</span>
  check_text = <span $weight foreground="##0f0f0f"> Touch Auth-Key</span>
  check_color = rgba(240, 206, 109, 0)
  fail_text = <span $weight foreground="##0f0f0f">Authentication Failed</span>
  fail_color = rgba(246, 100, 112, 0)
  position = 0%, 0%
}

label {
  monitor = $desktop_screen
  text = <span>Shutdown</span>
  color = $fg
  font_size = 35
  onclick = shutdown now
  position = -13%, -6.5%
}

label {
  monitor = $desktop_screen
  text = <span>Reboot</span>
  color = $fg
  font_size = 35
  onclick = shutdown now
  position = 0%, -6.5%
}

label {
  monitor = $desktop_screen
  text = <span>Suspend</span>
  color = $fg
  font_size = 35
  onclick = shutdown now
  position = 13.5%, -6.5%
}

